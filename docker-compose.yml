services:
  postgres:
    image: postgres:16-alpine
    container_name: recrutamento-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: recrutamento
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin1234
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
